<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHSE Class of 1971 · 60th Birthday Party</title>
<style>
  :root {
    --navy: #1f3a5f;
    --bg: #f7f5f1;
    --card: #ffffff;
    --line: #d0cbc2;
    --muted: #6b665e;
    --text: #111111;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--navy);
    color: #fff;
    padding: 20px 24px 18px;
  }
  header .school { margin: 0 0 4px; opacity: .85; font-size: .9rem; }
  header h1 { margin: 0; font-size: clamp(1.35rem, 3vw, 1.75rem); font-weight: 700; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 24px 64px; }
  .nav {
    margin: 0 0 18px;
    font-size: .95rem;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    align-items: center;
  }
  .nav a { color: var(--navy); font-weight: 700; text-decoration: none; }
  .nav a:hover, .nav a:focus { text-decoration: underline; outline: none; }
  .card {
    background: var(--card);
    border: 1px solid #e2ddd4;
    border-radius: 10px;
    padding: 20px 22px;
  }
  .date {
    margin: 0 0 6px;
    color: #333;
    font-size: 1.05rem;
    font-weight: 700;
  }
  .note {
    margin: 0 0 14px;
    color: var(--text);
    font-size: .95rem;
    line-height: 1.5;
  }
  .note:last-child { margin-bottom: 0; }
  .photo { margin: 18px 0 0; }
  .photo img { display: block; width: 100%; max-width: 564px; height: auto; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  .photo figcaption { margin-top: 8px; font-size: .85rem; color: var(--muted); }
  footer {
    margin-top: 36px;
    text-align: center;
    color: var(--muted);
    font-size: .8rem;
  }
  footer a { color: var(--navy); font-weight: 700; text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
<link rel="stylesheet" href="../assets/home-button.css">
</head>
<body>
<header>
  <p class="school">Cranston High School East</p>
  <h1>60th Birthday Party</h1>
</header>
<div class="wrap">
  <p class="nav">
    <a href="index.html">← Reunions directory</a>
    <a href="photos-60.html">Photos</a>
    <a href="../">Homepage</a>
  </p>
  <div class="card">
    <p class="date">2013</p>
    <p class="note">The class held a 60th birthday party in 2013. A fuller writeup will be added.</p>
    <figure class="photo">
      <a href="photos-60.html"><img src="images/60/DanBarry-DianneCentofanteCampbell-PatGiarrusso.jpg" alt="Dan Barry, Dianne (Centofante) Campbell, Pat Giarrusso"></a>
      <figcaption>Dan Barry, Dianne (Centofante) Campbell, Pat Giarrusso</figcaption>
    </figure>
  </div>
  <footer>
    <a href="index.html">← Reunions directory</a>
    ·
    <a href="photos-60.html">Photos</a>
    ·
    <a href="../">Homepage</a>
    · CHSE Class of 1971
  </footer>
</div>
