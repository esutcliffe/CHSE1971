<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHSE Class of 1971 · 71st Birthday Party</title>
<style>
  :root {
    --navy: #1f3a5f;
    --bg: #f7f5f1;
    --card: #ffffff;
    --line: #d0cbc2;
    --muted: #6b665e;
    --text: #111111;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--navy);
    color: #fff;
    padding: 20px 24px 18px;
  }
  header .school { margin: 0 0 4px; opacity: .85; font-size: .9rem; }
  header h1 { margin: 0; font-size: clamp(1.35rem, 3vw, 1.75rem); font-weight: 700; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 24px 64px; }
  .nav {
    margin: 0 0 18px;
    font-size: .95rem;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    align-items: center;
  }
  .nav a { color: var(--navy); font-weight: 700; text-decoration: none; }
  .nav a:hover, .nav a:focus { text-decoration: underline; outline: none; }
  .card {
    background: var(--card);
    border: 1px solid #e2ddd4;
    border-radius: 10px;
    padding: 20px 22px;
  }
  .date {
    margin: 0 0 6px;
    color: #333;
    font-size: 1.05rem;
    font-weight: 700;
  }
  .venue {
    margin: 0 0 14px;
    color: var(--muted);
    font-size: .95rem;
  }
  .note {
    margin: 0;
    color: var(--text);
    font-size: .95rem;
    line-height: 1.5;
  }
  footer {
    margin-top: 36px;
    text-align: center;
    color: var(--muted);
    font-size: .8rem;
  }
  footer a { color: var(--navy); font-weight: 700; text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<header>
  <p class="school">Cranston High School East</p>
  <h1>71st Birthday Party</h1>
</header>
<div class="wrap">
  <p class="nav">
    <a href="index.html">← Reunions directory</a>
    <a href="../">Homepage</a>
  </p>
  <div class="card">
    <p class="date">Saturday, September 7, 2024</p>
    <p class="note">This class event was held Saturday, September 7, 2024. Photos and a fuller writeup will be added.</p>
  </div>
  <footer>
    <a href="index.html">← Reunions directory</a>
    ·
    <a href="../">Homepage</a>
    · CHSE Class of 1971
  </footer>
</div>
</body>
</html>
