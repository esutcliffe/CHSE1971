<style>

  :root {
    --navy: #1f3a5f;
    --bg: #f7f5f1;
    --card: #ffffff;
    --line: #d0cbc2;
    --muted: #6b665e;
    --text: #111111;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--navy);
    color: #fff;
    padding: 20px 24px 18px;
  }
  header .school { margin: 0 0 4px; opacity: .85; font-size: .9rem; }
  header h1 { margin: 0; font-size: clamp(1.35rem, 3vw, 1.75rem); font-weight: 700; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 24px 64px; }
  .nav {
    margin: 0 0 8px;
    font-size: .95rem;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    align-items: center;
  }
  .nav a { color: var(--navy); font-weight: 700; text-decoration: none; }
  .nav a:hover { text-decoration: underline; }
  .meta { color: var(--muted); font-size: .9rem; margin: 0 0 18px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
    align-items: start;
  }
  .tile {
    margin: 0;
    background: var(--card);
    border: 1px solid #e2ddd4;
    border-radius: 10px;
    overflow: hidden;
    display: block;
    text-decoration: none;
    color: inherit;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .tile:hover, .tile:focus {
    border-color: var(--navy);
    box-shadow: 0 2px 8px rgba(31,58,95,.1);
    outline: none;
  }
  .tile img {
    width: 100%;
    height: auto;
    display: block;
    vertical-align: middle;
    background: #e8eef6;
  }
  .cap {
    display: block;
    padding: 8px 10px 10px;
    font-size: .78rem;
    color: var(--muted);
    line-height: 1.35;
  }
  .pdfs {
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
  }
  .pdfs h2 {
    margin: 0 0 10px;
    font-size: 1rem;
    color: var(--navy);
  }
  .pdfs ul { margin: 0; padding-left: 1.2rem; }
  .pdfs a { color: var(--navy); }
  footer {
    margin-top: 36px;
    text-align: center;
    color: var(--muted);
    font-size: .8rem;
  }
  footer a { color: var(--navy); font-weight: 700; text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  @media (max-width: 800px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

</style>
</head>
